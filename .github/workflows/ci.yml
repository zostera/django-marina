name: CI
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Lint source code
        run: just lint

  python_django_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1", "main"]
        exclude:
          # Django 6.0
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"
          # Django 6.1
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.1"
          # Django main
          - python-version: "3.10"
            django-version: "main"
          - python-version: "3.11"
            django-version: "main"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Install Django ${{ matrix.django-version }}
        run: |
          if [ "${{ matrix.django-version }}" = "main" ]; then
            uv pip install "https://github.com/django/django/archive/main.tar.gz"
          else
            uv pip install --prerelease allow "Django==${{ matrix.django-version }}.*"
          fi

      - name: Debug - Show versions
        run: |
          echo "=== Python Version ==="
          uv run --no-sync python --version
          echo "=== Django Version ==="
          uv run --no-sync python -c "import django; print(f'Django: {django.__version__}')"

      - name: Run tests with coverage
        run: uv run --no-sync coverage run manage.py test --verbosity=2

      - name: Upload coverage to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
        run: |
          uvx coveralls --service=github

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Build package
        run: just build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Build documentation
        run: just docs

  tests:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python_django_matrix, lint, docs, build]
    steps:
      - name: Finish Coveralls parallel build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # This job is the only required status check on main, so it has to fail
      # whenever any job it needs fails. Checking the matrix alone left docs and
      # build ungated: neither feeds the matrix, so a failure in either kept the
      # matrix green and this job with it. Lint was already covered, since the
      # matrix needs it and a skipped matrix is not a success. Checking every
      # need directly means the gate no longer depends on the graph's shape. No
      # job here is conditional, so a skipped need also means something failed.
      - name: Check that every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          MATRIX: ${{ needs.python_django_matrix.result }}
          LINT: ${{ needs.lint.result }}
          DOCS: ${{ needs.docs.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "python_django_matrix: $MATRIX"
          echo "lint:                 $LINT"
          echo "docs:                 $DOCS"
          echo "build:                $BUILD"
          echo "::error::A job this gate depends on did not succeed."
          exit 1
